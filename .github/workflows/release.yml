name: Release

on:
  push:
    tags:
      - 'v*'

# Build jobs only read the repository; the release job below opts in to more.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            artifact: zlodev-linux-amd64
          - target: aarch64-linux
            artifact: zlodev-linux-arm64
          - target: aarch64-macos
            artifact: zlodev-darwin-arm64
          - target: x86_64-windows
            artifact: zlodev-windows-amd64

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -Dversion=${{ steps.version.outputs.VERSION }}

      - name: Package
        run: |
          if [ "${{ matrix.target }}" = "x86_64-windows" ]; then
            cd zig-out/bin && zip ../../${{ matrix.artifact }}.zip zlodev.exe
          else
            tar -czf ${{ matrix.artifact }}.tar.gz -C zig-out/bin zlodev
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # sign the build provenance attestation
      attestations: write  # store the attestation
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum zlodev-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/zlodev-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: artifacts/*
